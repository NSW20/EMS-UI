<div class="container">
   <h2 class="text-center mt-2 header-color">Department</h2>
   <button mat-button (click)="openAddDialog()" class="mb-3"><mat-icon>add</mat-icon>Add Department</button>
<table mat-table [dataSource]="departments">
   <ng-container matColumnDef="departmentId">
      <th mat-header-cell *matHeaderCellDef>Id</th>
      <td mat-cell *matCellDef="let element">{{element.departmentId}}</td>
   </ng-container>
      <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">{{element.name}}</td>
   </ng-container>
      <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element">{{element.description}}</td>
   </ng-container>
      <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-button (click)="openEditDialog(element)" class="edit-btn" matTooltip="Click to edit department"> <mat-icon>edit</mat-icon>Edit</button>
        <button mat-button (click)="openRemoveDialog(element)" class="edit-remove mx-sm-2" matTooltip="remove"> <mat-icon>delete</mat-icon>Remove</button>
      </td>
   </ng-container>
   <tr mat-header-row *matHeaderRowDef="departmentColumns" class="table-style"></tr>
   <tr mat-row *matRowDef="let row;columns:departmentColumns" class="table-data"></tr>
</table>
</div>
