<div class="container">
   <h2 class="text-center text-white mt-2 bg-secondary">Department</h2>
   <button mat-button (click)="openAddDialog()"><mat-icon>add</mat-icon>Add Department</button>
<table mat-table [dataSource]="dataSource">
   <ng-container matColumnDef="departmentId">
      <th mat-header-cell *matHeaderCellDef>Id</th>
      <td mat-cell *matCellDef="let element">{{element.departmentId}}</td>
   </ng-container>
      <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">{{element.name}}</td>
   </ng-container>
      <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element">{{element.description}}</td>
   </ng-container>
      <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-button (click)="openEditDialog(element)"> <mat-icon>edit</mat-icon>Edit</button>
        <button mat-button (click)="openRemoveDialog(element)"> <mat-icon>delete</mat-icon>Remove</button>
      </td>
   </ng-container>
   <tr mat-header-row *matHeaderRowDef="departmentColumns"></tr>
   <tr mat-row *matRowDef="let row;columns:departmentColumns"></tr>
</table>
</div>
