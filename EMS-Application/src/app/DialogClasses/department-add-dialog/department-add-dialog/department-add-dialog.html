<h2 mat-dialog-title>Add Department</h2>
<mat-dialog-content>
   <form [formGroup]="addDepartment">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Title</mat-label>
        <input matInput type="text" formControlName="name"/>
      </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
        <mat-label>Description</mat-label>
        <input matInput type="text" formControlName="description"/>
      </mat-form-field>
   </form>
   <mat-dialog-actions align="end">
     <button mat-button mat-dialog-close (click)="closeDialog()">Close</button>
     <button mat-button (click)="submitAddDepartment()"><mat-icon>save</mat-icon>Save</button>
   </mat-dialog-actions>
</mat-dialog-content>
