<h2 mat-dialog-title>Add Designation</h2>
  <mat-dialog-content class="mt-3">
    <form [formGroup]="addDesignation">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Designation</mat-label>
        <input matInput type="text" formControlName="title"/>
        <mat-error>
          @if(addDesignation.get('title')?.hasError('required')){
             Designation title is required
          }
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-100">
        <mat-select  formControlName="departmentId">
          <mat-option [value]="0">Choose department</mat-option>
          @for(department of allDepartment;track department.departmentId){
          <mat-option [value]="department.departmentId">{{department.name}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  </mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close (click)="cancel()"><mat-icon>cancel</mat-icon>Cancel</button>
  <button mat-raised-button color="primary" (click)="OnSubmit()"><mat-icon>save</mat-icon>Save</button>
</mat-dialog-actions>
