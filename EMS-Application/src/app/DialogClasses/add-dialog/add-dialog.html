<h2 mat-dialog-title>Add Designation</h2>
  <mat-dialog-content class="mt-3">
    <form [formGroup]="addDesignation">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Designation</mat-label>
        <input matInput type="text" formControlName="title"/>
        <mat-error>
          @if(addDesignation.get('title')?.hasError('required')){
             Designation title is required
          }
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>DepartmentId</mat-label>
        <input matInput type="number" formControlName="departmentId" />
         <mat-error>
          @if(addDesignation.get('departmentId')?.hasError('required')){
             Department Id is required
          }
        </mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="OnSubmit()">Save</button>
</mat-dialog-actions>
