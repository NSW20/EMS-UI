<h2 mat-dialog-title>Log Out</h2>
<mat-dialog-content>
    <p><span class="fw-bold">Are you sure you want to log out??</span></p>
</mat-dialog-content>
<mat-card-actions align="end">
   <button mat-button (click)="onSubmit()"><mat-icon>done</mat-icon>Yes</button>
   <button mat-button mat-dialog-close (click)="OnCancel()"><mat-icon>cancel</mat-icon>Cancel</button>
</mat-card-actions>
