<h2 mat-dialog-title>Edit Department</h2>
<mat-dialog-content class="mt-2">
   <form [formGroup]="editDepartmentModule">
      <mat-form-field appearance="outline" class="w-100">
       <mat-label>DepartmentId</mat-label>
       <input matInput type="number" formControlName="departmentId"/>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-100">
       <mat-label>Name</mat-label>
       <input matInput type="text" formControlName="name"/>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-100">
       <mat-label>Description</mat-label>
       <input matInput type="text" formControlName="description"/>
      </mat-form-field>
   </form>
   <mat-dialog-actions align="end">
      <button mat-button (click)="clearForm()" mat-dialog-close><mat-icon>cancel</mat-icon>Cancel</button>
            <button mat-button (click)="editDepartmentSubmit()"><mat-icon>save</mat-icon>Save</button>
   </mat-dialog-actions>
</mat-dialog-content>
