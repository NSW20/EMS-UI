<h2 mat-dialog-title>Edit Designation</h2>

<mat-dialog-content class="mt-3">
  <form [formGroup]="editReactiveForm">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>DesignationId</mat-label>
      <input matInput type="number" readonly formControlName="designationId"/>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Designation</mat-label>
      <input matInput type="text" formControlName="title"/>
    </mat-form-field>
      <mat-form-field appearance="outline" class="w-100">
      <mat-select formControlName="departmentId">
      <mat-option value="" disabled>Choose department</mat-option>
      @for (department of allDepartment; track department.departmentId) {
      <mat-option [value]="department.departmentId">
        {{ department.name }}
      </mat-option>
      }
      </mat-select>
    </mat-form-field>
  </form>
  <mat-dialog-actions align="end">
     <button mat-button mat-dialog-close (click)="cancel()"><mat-icon>cancel</mat-icon>Cancel</button>
     <button mat-button (click)="OnEditSubmit()"><mat-icon>save</mat-icon>Save</button>
  </mat-dialog-actions>
</mat-dialog-content>
