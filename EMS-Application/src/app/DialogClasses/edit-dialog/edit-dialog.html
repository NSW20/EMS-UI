<h2 mat-dialog-title>Edit Designation</h2>

<mat-dialog-content class="mt-3">
  <form [formGroup]="editReactiveForm">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>DesignationId</mat-label>
      <input matInput type="number" readonly formControlName="designationId"/>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Designation</mat-label>
      <input matInput type="text" formControlName="title"/>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>DepartmentId</mat-label>
      <input matInput type="number" formControlName="departmentId"/>
    </mat-form-field>
  </form>
  <mat-dialog-actions align="end">
     <button mat-button mat-dialog-close (click)="cancel()">Cancel</button>
     <button mat-button (click)="OnEditSubmit()">Save</button>
  </mat-dialog-actions>
</mat-dialog-content>
