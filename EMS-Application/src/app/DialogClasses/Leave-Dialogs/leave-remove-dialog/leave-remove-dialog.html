<h2 mat-dialog-title>Remove Leave</h2>
<mat-dialog-content>
    <p>Are you sure you want to remove your leave from <span class="fw-bold">{{data.fromDate |date:'dd-MMM-yyyy'}}</span> to <span class="fw-bold">{{data.toDate|date:'dd-MMM-yyyy'}} ?</span></p>
    <mat-dialog-actions class="mt-2">
        <button mat-button (click)="onRemoveLeave()"><mat-icon>save</mat-icon>Save</button>
         <button mat-button mat-dialog-close><mat-icon>cancel</mat-icon>Cancel</button>
    </mat-dialog-actions>
</mat-dialog-content>
