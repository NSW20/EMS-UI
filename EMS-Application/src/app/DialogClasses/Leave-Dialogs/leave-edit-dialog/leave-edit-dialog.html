<div class="container-fluid">
   <h2 mat-dialog-title>Edit Leaves</h2>
   <mat-dialog-content>
       <form [formGroup]="leaveUpdateForm" class="mt-2">
            <mat-form-field appearance="outline" class="w-100">
             <mat-label>From Date</mat-label>
             <input matInput [matDatepicker]="picker" formControlName="fromDate"/>
             <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
             <mat-datepicker #picker></mat-datepicker>
           </mat-form-field>
            <mat-form-field appearance="outline" class="w-100">
             <mat-label>To Date</mat-label>
             <input matInput [matDatepicker]="picker1" formControlName="toDate"/>
             <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
             <mat-datepicker #picker1></mat-datepicker>
           </mat-form-field>
            <mat-form-field appearance="outline" class="w-100">
             <mat-label>Reason</mat-label>
             <input matInput formControlName="reason" type="text"/>
           </mat-form-field>
            <mat-form-field appearance="outline" class="w-100">
             <mat-label>leave Type</mat-label>
             <mat-select formControlName="leaveType">
                <mat-option [value]="0" selected>Select Leave Type</mat-option>
                @for(leave of leaveType;track $index){
                    <mat-option [value]="$index">{{leave}}</mat-option>
                }
             </mat-select>
           </mat-form-field>
       </form>
       <mat-dialog-actions align="end">
         <button mat-button (click)="editLeave()"><mat-icon>save</mat-icon>Save</button>
           <button mat-button mat-dialog-close><mat-icon>cancel</mat-icon>Cancel</button>
       </mat-dialog-actions>
   </mat-dialog-content>
</div>
