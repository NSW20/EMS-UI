<div class="container-fluid">
   <h2 class="text-center mt-2 header-color">Designations</h2>
   <button mat-button class="mt-2" (click)="openAddDialog()" class="mb-3"><mat-icon>add</mat-icon> New Designation</button>
   <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="designationId">
      <th mat-header-cell *matHeaderCellDef>Id</th>
      <td mat-cell *matCellDef="let element">{{element.designationId}}</td>
    </ng-container>
    <ng-container matColumnDef="title">
       <th mat-header-cell *matHeaderCellDef>Designation</th>
       <td mat-cell *matCellDef="let element">{{element.title}}</td>
    </ng-container>
    <ng-container matColumnDef="departmentId">
      <th mat-header-cell *matHeaderCellDef>DepartmentId</th>
      <td mat-cell *matCellDef="let element">{{element.departmentId}}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
     <th mat-header-cell *matHeaderCellDef>Actions</th>
     <td mat-cell *matCellDef="let element">
        <button mat-button (click)="openEditDialog(element)" class="edit-btn"><mat-icon>edit</mat-icon>Edit</button>
        <button mat-button (click)="openRemoveDialog(element)" class="edit-remove mx-sm-2"><mat-icon>delete</mat-icon>Remove</button>
     </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="table-style"></tr>
    <tr mat-row *matRowDef="let row;columns:displayedColumns;" class="table-data"></tr>
</table>
<mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons></mat-paginator>
</div>
