<mat-toolbar class="menu-color">
  <span>EMS</span>
  <span class="spacer"></span>
  @if(authService.tokenSignal()===null){
     <button mat-button routerLink="/register" class="menu-button"><mat-icon>person_add</mat-icon>Register</button>
      <button mat-button routerLink="/login" class="menu-button"><mat-icon>login</mat-icon>Login</button>
  }
  @else {
  <button mat-button class="fw-bold fs-6" matTooltip="Logged In User"><mat-icon>sentiment_satisfied</mat-icon>Welcome {{authService.getLoggedInUser()}} </button>
  <button mat-button routerLink="/designation" class="menu-button btn_white{"><mat-icon>badge</mat-icon>Designation</button>
  <button mat-button routerLink="/department" class="menu-button"><mat-icon>apartment</mat-icon>Department</button>
   <button mat-button routerLink="/employee" class="menu-button btn_white{"><mat-icon>employee</mat-icon>Employee</button>
  <button mat-button (click)="openLogout()" class="menu-button"> <mat-icon>logout</mat-icon>Logout</button>
  }
</mat-toolbar>

<div class="container-fluid">
   <router-outlet></router-outlet>
</div>
