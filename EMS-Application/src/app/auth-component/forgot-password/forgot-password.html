
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="w-25">
   <mat-card class="mat-card-style card-bg shadow">
        <mat-card-title class="text-center mt-10 header-color p-2 fs-3 bg-radius">Forgot Password</mat-card-title>
       <mat-card-content class="mt-2">
        <form [formGroup]="forgotPassWordForm">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email"/>
            @if(forgotPassWordForm.get('email')?.hasError('required')&&forgotPassWordForm.touched){
                  <mat-error>Please enter your email</mat-error>
            }
            @else if(forgotPassWordForm.get('email')?.hasError('email')&&forgotPassWordForm.touched){
                <mat-error>Please enter a valid email</mat-error>
            }
          </mat-form-field>
        </form>
       </mat-card-content>
       <mat-card-actions align="end">
          <button mat-button (click)="onSubmitForgotPassword()" class="btn_register"><mat-icon>done</mat-icon>Reset</button>
          <button mat-button (click)="onSubmitResetForm()" class="btn_cancel mx-2"><mat-icon>cancel</mat-icon>Cancel</button>
       </mat-card-actions>
   </mat-card>
</div>
