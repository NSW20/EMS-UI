<div class="container-fluid">
    <h2 class="text-center header-color mt-2">Leaves</h2>
    <button mat-button (click)="applyLeaveMethod()"><mat-icon>add</mat-icon>Apply Leave</button>
  <table mat-table [dataSource]="allLeaves" class="mt-2">
     <ng-container matColumnDef="employeeId">
           <th mat-header-cell *matHeaderCellDef>EmployeeId</th>
           <td mat-cell *matCellDef="let element">{{element.employeeId}}</td>
     </ng-container>
     <ng-container matColumnDef="fromDate">
           <th mat-header-cell *matHeaderCellDef>From Date</th>
           <td mat-cell *matCellDef="let element">{{element.fromDate |date:'dd-MMM-yyyy'}}</td>
     </ng-container>
     <ng-container matColumnDef="toDate">
           <th mat-header-cell *matHeaderCellDef>To Date</th>
           <td mat-cell *matCellDef="let element">{{element.toDate|date:'dd-MMM-yyyy'}}</td>
     </ng-container>
     <ng-container matColumnDef="reason">
           <th mat-header-cell *matHeaderCellDef>Reason</th>
           <td mat-cell *matCellDef="let element">{{element.reason}}</td>
     </ng-container>
     <ng-container matColumnDef="leaveType">
           <th mat-header-cell *matHeaderCellDef>Leave Type</th>
           <td mat-cell *matCellDef="let element">
            <span [ngClass]="{
                'badge-casual':loadLeaveType(element.leaveType)==='Casual Leave',
                'badge-earned':loadLeaveType(element.leaveType)==='Earned Leave',
                 'badge-sick':loadLeaveType(element.leaveType)==='Sick Leave',
            }" class="badge">{{loadLeaveType(element.leaveType)}}</span>
           </td>
     </ng-container>
      <ng-container matColumnDef="status">
           <th mat-header-cell *matHeaderCellDef>Status</th>
           <td mat-cell *matCellDef="let element">
            <span [ngClass]="{
                'badge-success':loadLeaveStatus(element.status)==='Approved',
                'badge-warning':loadLeaveStatus(element.status)==='Pending',
                'badge-danger':loadLeaveStatus(element.status)==='Rejected',
            }" class="badge">{{loadLeaveStatus(element.status)}}</span>
           </td>

     </ng-container>
      <ng-container matColumnDef="approvedBy">
           <th mat-header-cell *matHeaderCellDef>ApprovedBy</th>
           <td mat-cell *matCellDef="let element">{{element.approvedBy}}</td>
     </ng-container>
           <ng-container matColumnDef="Action">
           <th mat-header-cell *matHeaderCellDef>Action</th>
           <td mat-cell *matCellDef="let element">
            <button mat-button class="edit-btn" (click)="editLeave(element)"><mat-icon>edit</mat-icon>Edit</button>
             <button mat-button class="edit-remove mx-2" (click)="removeLeave(element)"><mat-icon>delete</mat-icon>Remove</button>
           </td>
     </ng-container>
     <tr mat-header-row *matHeaderRowDef="displayColumns" class="table-style"></tr>
     <tr mat-row *matRowDef="let row;columns:displayColumns" class="table-data"></tr>
  </table>
</div>
